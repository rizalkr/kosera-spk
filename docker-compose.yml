# Docker Compose for Kosera API Development
# Updated: Added pgvector support for AI-Enhanced DSS

services:
  # PostgreSQL Database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: kosera-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: kosera
      POSTGRES_USER: kosera
      POSTGRES_PASSWORD: kosera123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      - kosera-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosera -d kosera"]
      interval: 30s
      timeout: 10s
      retries: 5

  # PostgreSQL Test Database with pgvector (Isolated)
  db_test:
    image: pgvector/pgvector:pg16
    container_name: kosera-db-test
    restart: unless-stopped
    profiles:
      - test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: kosera_test
      POSTGRES_USER: kosera
      POSTGRES_PASSWORD: kosera123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    networks:
      - kosera-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kosera -d kosera_test"]
      interval: 20s
      timeout: 5s
      retries: 10

  # Next.js Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: kosera-app
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://kosera:kosera123@db:5432/kosera
      - JWT_SECRET=your-super-secret-jwt-key-for-development
      - PORT=3000
      - AI_SERVICE_URL=http://ai-service:8000
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - kosera-network
    command: ["npm", "run", "dev"]

  # AI Service (Python FastAPI for text embedding)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: kosera-ai-service
    restart: unless-stopped
    environment:
      - TRANSFORMERS_CACHE=/app/models
      - HF_HOME=/app/models
    ports:
      - "8000:8000"
    volumes:
      # Persist model cache to avoid re-download
      - ai_models:/app/models
    networks:
      - kosera-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # pgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kosera-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kosera.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - kosera-network

volumes:
  postgres_data:
    driver: local
  postgres_test_data:
    driver: local
  pgadmin_data:
    driver: local
  ai_models:
    driver: local

networks:
  kosera-network:
    driver: bridge
